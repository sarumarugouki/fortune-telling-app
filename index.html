<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>占いアプリ</title>
<style>
  :root {
    --gold: #ffd98a;
    --gold-soft: rgba(255, 217, 138, 0.25);
    --ink: #0b0a1a;
    --mist: #bdb5e0;
    --text: #ece6ff;
    --panel: rgba(28, 22, 64, 0.72);
  }
  * { box-sizing: border-box; }
  body {
    font-family: "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif JP", "MS PMincho", serif;
    color: var(--text); margin: 0; padding: 24px 16px 40px; line-height: 1.8; min-height: 100vh;
    overflow-x: hidden;
    background: radial-gradient(ellipse at top, #3b2a6e 0%, #1c1440 45%, var(--ink) 100%) fixed;
  }
  body::before, body::after { content: ""; position: fixed; inset: 0; pointer-events: none; z-index: -1; }
  body::before {
    background-image:
      radial-gradient(1px 1px at 20px 30px, #fff, transparent),
      radial-gradient(1px 1px at 120px 80px, #ffe9b0, transparent),
      radial-gradient(1.5px 1.5px at 60px 140px, #fff, transparent),
      radial-gradient(1px 1px at 180px 20px, #d8ccff, transparent),
      radial-gradient(1px 1px at 240px 160px, #fff, transparent);
    background-size: 260px 200px; opacity: 0.7;
  }
  body::after {
    background-image:
      radial-gradient(2px 2px at 90px 120px, #ffd98a, transparent),
      radial-gradient(2px 2px at 210px 50px, #ffd98a, transparent);
    background-size: 330px 260px; animation: twinkle 6s ease-in-out infinite;
  }
  @keyframes twinkle { 0%, 100% { opacity: 0.35; } 50% { opacity: 1; } }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

  h1 {
    text-align: center; font-size: 30px; letter-spacing: 0.25em; margin: 8px 0 14px;
    background: linear-gradient(90deg, #fff3d0, var(--gold), #fff3d0);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    text-shadow: 0 0 18px rgba(255, 217, 138, 0.35);
  }
  h1::before { content: "☾  "; -webkit-text-fill-color: var(--gold); }
  h1::after { content: "  ☽"; -webkit-text-fill-color: var(--gold); }
  h2 {
    color: var(--gold); margin: 0 0 14px; font-size: 20px; letter-spacing: 0.1em;
    padding-bottom: 8px; border-bottom: 1px solid var(--gold-soft);
  }
  h3 { color: var(--gold); font-size: 17px; margin: 18px 0 6px; letter-spacing: 0.05em; }
  .container { max-width: 660px; margin: 0 auto; }

  .moon-wrap { text-align: center; margin: 4px 0 20px; }
  .moon {
    width: 84px; height: 84px; margin: 0 auto; border-radius: 50%; position: relative; overflow: hidden;
    background: radial-gradient(circle at 35% 35%, #fffaf0, #e8dcb8 70%);
    box-shadow: 0 0 40px rgba(255, 240, 200, 0.4);
  }
  .moon-shadow { position: absolute; inset: 0; border-radius: 50%; background: #120e2e; transition: transform 1.2s ease; }
  .moon-label { margin: 8px 0 0; color: var(--mist); font-size: 14px; letter-spacing: 0.1em; }

  .card-box {
    background: var(--panel); border: 1px solid var(--gold-soft); border-radius: 18px; padding: 24px; margin-bottom: 22px;
    box-shadow: 0 0 24px rgba(140, 100, 255, 0.18), inset 0 0 40px rgba(255, 217, 138, 0.04);
  }
  label { display: block; margin: 10px 0 6px; color: var(--mist); font-size: 15px; }
  input {
    width: 100%; padding: 10px 12px; font-size: 16px; font-family: inherit; color: var(--text);
    background: rgba(10, 8, 30, 0.6); border: 1px solid rgba(255, 217, 138, 0.3);
    border-radius: 10px; margin-bottom: 14px; outline: none; color-scheme: dark;
  }
  input:focus { border-color: var(--gold); box-shadow: 0 0 12px rgba(255, 217, 138, 0.35); }
  input::placeholder { color: #7f78a8; }
  input[type="checkbox"] { width: auto; margin: 0 8px 0 0; }
  button {
    font-family: inherit; font-size: 16px; letter-spacing: 0.08em; padding: 10px 22px; border: none;
    border-radius: 999px; cursor: pointer; font-weight: bold; color: #2a1d4a;
    background: linear-gradient(135deg, #fff1c4, var(--gold) 50%, #e8b65a);
    box-shadow: 0 0 14px rgba(255, 217, 138, 0.3); transition: transform 0.2s, box-shadow 0.2s;
  }
  button:hover { transform: translateY(-1px); box-shadow: 0 0 22px rgba(255, 217, 138, 0.6); }

  .birthday-box { padding: 18px 24px; }
  .check-row { display: flex; align-items: center; color: var(--mist); margin: 10px 0; }
  .birthday-box button { margin-top: 4px; }
  .birthday-box .small { margin-top: 10px; }

  .tabs { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-bottom: 24px; }
  .tab-btn {
    background: rgba(40, 32, 90, 0.7); color: var(--mist); font-weight: normal; padding: 8px 16px;
    border: 1px solid rgba(255, 217, 138, 0.2); box-shadow: none;
  }
  .tab-btn:hover { color: var(--gold); border-color: var(--gold-soft); }
  .tab-btn.active {
    background: linear-gradient(135deg, #fff1c4, var(--gold) 50%, #e8b65a); color: #2a1d4a;
    font-weight: bold; border-color: var(--gold); box-shadow: 0 0 18px rgba(255, 217, 138, 0.5);
  }
  .tab-panel { display: none; }
  .tab-panel.active { display: block; }

  .result { margin-top: 18px; }
  .result > * { animation: fadeUp 0.7s ease both; }
  .stars { color: var(--gold); font-size: 20px; letter-spacing: 3px; text-shadow: 0 0 10px rgba(255, 217, 138, 0.6); }
  .score-row { margin: 10px 0; }
  .score-label { display: inline-block; min-width: 100px; color: var(--mist); }
  .small { font-size: 13px; color: var(--mist); opacity: 0.85; }
  .error { color: #ffb3c1; border-left: 3px solid #ffb3c1; padding-left: 12px; }

  .card-art {
    height: 130px; margin: 12px 0; border-radius: 10px; border: 1px solid var(--gold-soft);
    background: radial-gradient(circle at 50% 40%, rgba(90, 70, 160, 0.5), rgba(15, 10, 40, 0.9) 75%);
    display: flex; align-items: center; justify-content: center; overflow: hidden; transition: transform 0.4s ease;
  }
  .card-art.art-rev { transform: rotate(180deg); }
  .card-art svg {
    width: 64px; height: 64px; fill: none; stroke: var(--gold); stroke-width: 1.6;
    stroke-linecap: round; stroke-linejoin: round; filter: drop-shadow(0 0 8px rgba(255, 217, 138, 0.6));
  }
  .art-glyph { font-size: 64px; color: var(--gold); text-shadow: 0 0 14px rgba(255, 217, 138, 0.7); line-height: 1; }
  .card-art:has(img) {
    height: auto;
    aspect-ratio: 2 / 3;
    max-width: 180px;
    margin-left: auto;
    margin-right: auto;
    padding: 0;
    border: none;
  }
  .card-art img { width: 100%; height: 100%; object-fit: cover; border-radius: 10px; }

  .tarot-slot { position: relative; margin: 14px 0; animation: fadeUp 0.7s ease both; }
  .tarot-slot.shuffling { animation: sway 0.9s ease-in-out infinite alternate; }
  @keyframes sway { from { transform: rotate(-1.5deg); } to { transform: rotate(1.5deg); } }
  .tarot-slot > .position { font-size: 13px; color: var(--mist); letter-spacing: 0.1em; margin-bottom: 4px; }
  .tarot-flip { position: relative; transform-style: preserve-3d; transition: transform 0.9s cubic-bezier(0.2, 0.7, 0.2, 1); }
  .tarot-flip.flipped { transform: rotateY(180deg); }
  .face { backface-visibility: hidden; -webkit-backface-visibility: hidden; border-radius: 14px; }
  .face.front {
    position: relative; transform: rotateY(180deg); animation: none;
    background: linear-gradient(160deg, rgba(60, 40, 120, 0.65), rgba(20, 14, 50, 0.85));
    border: 1px solid var(--gold); padding: 16px 18px; box-shadow: 0 0 20px rgba(255, 217, 138, 0.15);
  }
  .face.front .name { font-size: 20px; font-weight: bold; color: #fff3d0; margin: 4px 0; }
  .face.back {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    font-size: 48px; color: var(--gold); border: 1px solid var(--gold);
    background: radial-gradient(circle at 50% 40%, #4a3a8a, #1c1440 70%);
    box-shadow: inset 0 0 30px rgba(255, 217, 138, 0.15);
  }
  .face.back::before { content: var(--sigil, "☾"); text-shadow: 0 0 16px rgba(255, 217, 138, 0.6); }
  .face.back::after {
    content: ""; position: absolute; inset: 10px; border: 1px dashed rgba(255, 217, 138, 0.35);
    border-radius: 10px; pointer-events: none;
  }
  @keyframes glowIn {
    0% { box-shadow: 0 0 0 rgba(255, 217, 138, 0); }
    40% { box-shadow: 0 0 40px rgba(255, 240, 200, 0.9); }
    100% { box-shadow: 0 0 20px rgba(255, 217, 138, 0.15); }
  }
  @keyframes sweep { from { transform: translateX(-100%); } to { transform: translateX(100%); } }
  .tarot-flip.flipped .face.front { animation: glowIn 1.4s ease 0.4s both; }
  .tarot-flip.flipped .face.front::before {
    content: ""; position: absolute; inset: 0; border-radius: 14px;
    background: linear-gradient(115deg, transparent 40%, rgba(255, 245, 210, 0.45) 50%, transparent 60%);
    transform: translateX(-100%); animation: sweep 1s ease 0.5s forwards; pointer-events: none;
  }
  .orientation { display: inline-block; font-size: 12px; padding: 2px 10px; border-radius: 999px; margin-left: 8px; vertical-align: middle; }
  .upright { background: rgba(120, 200, 150, 0.25); border: 1px solid rgba(120, 200, 150, 0.6); color: #cfffe0; }
  .reversed-label { background: rgba(200, 110, 160, 0.25); border: 1px solid rgba(200, 110, 160, 0.6); color: #ffd6ec; }
  .summary {
    background: rgba(20, 16, 50, 0.7); border-left: 3px solid var(--gold); border-radius: 12px;
    padding: 18px; margin-top: 22px; box-shadow: inset 0 0 30px rgba(255, 217, 138, 0.05);
  }
  .summary p { margin: 8px 0; }
  .summary.pending { display: none; }
  .summary.reveal { animation: fadeUp 0.8s ease both; }

  @media (max-width: 480px) {
    h1 { font-size: 24px; letter-spacing: 0.15em; }
    .card-box { padding: 18px; }
    .tab-btn { font-size: 14px; padding: 7px 12px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<div class="container">
  <h1>占いアプリ</h1>
  <div class="moon-wrap">
    <div class="moon"><div class="moon-shadow" id="moonShadow"></div></div>
    <p class="moon-label" id="moonLabel"></p>
  </div>

  <div class="card-box birthday-box">
    <label for="myBirthday">自分の生年月日（占いの入力に自動で入ります）</label>
    <input type="date" id="myBirthday">
    <label class="check-row">
      <input type="checkbox" id="saveBirthday">
      この端末に保存する
    </label>
    <button id="clearBirthday" type="button">保存した生年月日を消す</button>
    <p class="small">保存先はこのブラウザの中だけで、外部には送信されません。</p>
  </div>

  <nav class="tabs">
    <button class="tab-btn active" data-target="panel-daily">今日の総合運</button>
    <button class="tab-btn" data-target="panel-zodiac">星座占い</button>
    <button class="tab-btn" data-target="panel-numerology">数秘術</button>
    <button class="tab-btn" data-target="panel-couple">相性占い</button>
    <button class="tab-btn" data-target="panel-tarot">タロット</button>
  </nav>

  <section class="tab-panel active" id="panel-daily">
    <div class="card-box">
      <h2>今日の総合運</h2>
      <label for="dailyDate">生年月日</label>
      <input type="date" id="dailyDate">
      <button id="dailyBtn">今日の運勢を見る</button>
      <div class="result" id="dailyResult"></div>
    </div>
  </section>

  <section class="tab-panel" id="panel-zodiac">
    <div class="card-box">
      <h2>星座占い</h2>
      <label for="zodiacDate">生年月日</label>
      <input type="date" id="zodiacDate">
      <button id="zodiacBtn">星座を占う</button>
      <div class="result" id="zodiacResult"></div>
    </div>
  </section>

  <section class="tab-panel" id="panel-numerology">
    <div class="card-box">
      <h2>数秘術</h2>
      <label for="numDate">生年月日</label>
      <input type="date" id="numDate">
      <label for="nameReading">ふりがな（ひらがな・カタカナ）※名前数を見る場合</label>
      <input type="text" id="nameReading" placeholder="例：やまだたろう">
      <button id="numBtn">数秘術で占う</button>
      <div class="result" id="numResult"></div>
    </div>
  </section>

  <section class="tab-panel" id="panel-couple">
    <div class="card-box">
      <h2>相性占い</h2>
      <label for="coupleA">あなたの生年月日</label>
      <input type="date" id="coupleA">
      <label for="coupleB">相手の生年月日</label>
      <input type="date" id="coupleB">
      <button id="coupleBtn">相性を見る</button>
      <div class="result" id="coupleResult"></div>
    </div>
  </section>

  <section class="tab-panel" id="panel-tarot">
    <div class="card-box">
      <h2>タロット（3枚引き）</h2>
      <label for="question">質問（任意）</label>
      <input type="text" id="question" placeholder="例：今月の仕事運は？">
      <button id="drawBtn">カードを引く</button>
      <div class="result" id="tarotResult"></div>
    </div>
  </section>

  <p class="small" style="text-align:center;">※ 占いは娯楽としてお楽しみください。</p>
</div>

function escapeHtml(text) {
  return String(text).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function parseDate(s) {
  const [y, m, d] = s.split("-").map(Number);
  return { year: y, month: m, day: d };
}
function showError(id, msg) {
  document.getElementById(id).innerHTML = `<p class="error">${escapeHtml(msg)}</p>`;
}
function stars(n) { return "★".repeat(n) + "☆".repeat(5 - n); }
function todayIndex(len) {
  const now = new Date();
  const start = new Date(now.getFullYear(), 0, 0);
  return Math.floor((now - start) / 86400000) % len;
}
function todayString() {
  const now = new Date();
  const mm = String(now.getMonth() + 1).padStart(2, "0");
  const dd = String(now.getDate()).padStart(2, "0");
  return `${now.getFullYear()}-${mm}-${dd}`;
}
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function pickRandom(list) {
  return list[Math.floor(Math.random() * list.length)];
}

// ===== 生年月日の保存（この端末の中だけ） =====
function storageGet(key) {
  try { return localStorage.getItem(key); } catch (e) { return null; }
}
function storageSet(key, value) {
  try { localStorage.setItem(key, value); } catch (e) {}
}
function storageRemove(key) {
  try { localStorage.removeItem(key); } catch (e) {}
}
function isValidDateString(value) {
  if (!/^\d{4}-\d{2}-\d{2}$/.test(value || "")) return false;
  const [y, m, d] = value.split("-").map(Number);
  const date = new Date(Date.UTC(y, m - 1, d));
  return date.getUTCFullYear() === y && date.getUTCMonth() === m - 1 && date.getUTCDate() === d;
}
function applyBirthday(value) {
  document.getElementById("myBirthday").value = value;
  BIRTHDAY_INPUT_IDS.forEach(id => {
    document.getElementById(id).value = value;
  });
}
function setupBirthdaySave() {
  const myInput = document.getElementById("myBirthday");
  const saveCheck = document.getElementById("saveBirthday");
  const clearBtn = document.getElementById("clearBirthday");

  saveCheck.checked = storageGet(SAVE_PREF_KEY) !== "0";

  if (saveCheck.checked) {
    const saved = storageGet(STORAGE_KEY);
    if (isValidDateString(saved)) applyBirthday(saved);
    else if (saved !== null) storageRemove(STORAGE_KEY);
  }

  const onBirthdayInput = () => {
    const value = myInput.value;
    if (!isValidDateString(value)) return;
    applyBirthday(value);
    if (saveCheck.checked) storageSet(STORAGE_KEY, value);
  };
  myInput.addEventListener("change", onBirthdayInput);
  myInput.addEventListener("input", onBirthdayInput);

  saveCheck.addEventListener("change", () => {
    storageSet(SAVE_PREF_KEY, saveCheck.checked ? "1" : "0");
    if (saveCheck.checked) {
      if (isValidDateString(myInput.value)) storageSet(STORAGE_KEY, myInput.value);
    } else {
      storageRemove(STORAGE_KEY);
    }
  });

  clearBtn.addEventListener("click", () => {
    storageRemove(STORAGE_KEY);
    myInput.value = "";
    BIRTHDAY_INPUT_IDS.forEach(id => {
      document.getElementById(id).value = "";
    });
  });
}

// ===== 数秘術の計算 =====
function digitSum(n) {
  return String(n).split("").map(Number).reduce((a, b) => a + b, 0);
}
function reduceToSingle(n) {
  while (n > 9) n = digitSum(n);
  return n;
}
function reduceKeepMaster(n) {
  while (n > 9 && ![11, 22, 33].includes(n)) n = digitSum(n);
  return n;
}
function getLifePath(dateStr) {
  return reduceKeepMaster(digitSum(dateStr.replace(/-/g, "")));
}
const MASTER_BASE = { 11: 2, 22: 4, 33: 6 };
function toBase(n) { return MASTER_BASE[n] ?? n; }
function getBirthdayNumber(dateStr) {
  return reduceKeepMaster(parseDate(dateStr).day);
}
function getPersonalYear(dateStr, year) {
  const { month, day } = parseDate(dateStr);
  return reduceToSingle(digitSum(month) + digitSum(day) + digitSum(year));
}
function getPersonalMonth(personalYear, month) {
  return reduceToSingle(personalYear + month);
}

// ===== 星座 =====
function getSignByDate(dateStr) {
  const { month, day } = parseDate(dateStr);
  let name = "山羊座";
  for (const [em, ed, n] of ZODIAC_TABLE) {
    if (month < em || (month === em && day <= ed)) { name = n; break; }
  }
  return SIGNS.find(s => s.name === name);
}

const SMALL_KANA = { "ぁ": "あ", "ぃ": "い", "ぅ": "う", "ぇ": "え", "ぉ": "お", "ゃ": "や", "ゅ": "ゆ", "ょ": "よ", "ゎ": "わ", "っ": "つ" };
function toHiragana(str) {
  return str.replace(/[\u30a1-\u30f6]/g, ch => String.fromCharCode(ch.charCodeAt(0) - 0x60));
}
function getNameNumber(reading) {
  if (!kanaValueMap) {
    kanaValueMap = new Map();
    [...KANA_ORDER].forEach((ch, i) => kanaValueMap.set(ch, (i % 9) + 1));
  }
  const chars = [...toHiragana(reading).replace(/\s|　/g, "")];
  let total = 0, validCount = 0;
  const unknown = [];
  for (const ch of chars) {
    const base = SMALL_KANA[ch] ?? ch.normalize("NFD").charAt(0);
    const value = kanaValueMap.get(base);
    if (value === undefined) unknown.push(ch);
    else { total += value; validCount++; }
  }
  return { number: validCount > 0 ? reduceKeepMaster(total) : null, unknown };
}
function buildNameSection() {
  if (!NAME_FEATURE_ENABLED) {
    return `<h3>名前数</h3><p class="small">名前数は有料プランでご利用いただけます。</p>`;
  }
  const reading = document.getElementById("nameReading").value.trim();
  if (!reading) {
    return `<h3>名前数</h3><p class="small">ふりがなを入力すると、名前数を表示します。</p>`;
  }
  const result = getNameNumber(reading);
  if (result.number === null) {
    return `<h3>名前数</h3><p class="error">ひらがなまたはカタカナで入力してください。</p>`;
  }
  const info = EXPRESSION_NUMBERS[result.number];
  const unknownNote = result.unknown.length
    ? `<p class="small">読み取れなかった文字：${escapeHtml(result.unknown.join(""))}（ふりがなを確認してください）</p>` : "";
  return `
    <h3>名前数：${result.number}（${info.title}）</h3>
    <p>${info.text}</p>
    ${unknownNote}`;
}

// ===== 各機能 =====
function showDaily() {
  const v = document.getElementById("dailyDate").value;
  if (!v) return showError("dailyResult", "生年月日を入力してください。");
  const sign = getSignByDate(v);
  const today = todayString();
  const dayNumber = reduceToSingle(toBase(getLifePath(v)) + reduceToSingle(digitSum(today.replace(/-/g, ""))));
  const [score, theme, advice] = DAILY_DAYS[dayNumber];
  const lucky = LUCKY_COLORS[todayIndex(LUCKY_COLORS.length)];
  document.getElementById("dailyResult").innerHTML = `
    <p><strong>${today}</strong> の運勢</p>
    <div class="score-row"><span class="score-label">総合運</span><span class="stars">${stars(score)}</span></div>
    <p><strong>今日の数字：</strong>${dayNumber}（${theme}）</p>
    <p>${advice}</p>
    <p><strong>${sign.name}のひとこと：</strong>${sign.messages[todayIndex(sign.messages.length)]}</p>
    <p><strong>${ELEMENTS[sign.element]}のヒント：</strong>${DAILY_ELEMENT_TIPS[sign.element]}</p>
    <p><strong>ラッキーカラー：</strong>${lucky[0]}（${lucky[1]}）</p>`;
}
function showZodiac() {

function showNumerology() {
  const value = document.getElementById("numDate").value;
  if (!value) return showError("numResult", "生年月日を入力してください。");

  const now = new Date();
  const year = now.getFullYear();
  const month = now.getMonth() + 1;

  const lifePath = getLifePath(value);
  const life = LIFE_PATHS[lifePath];
  const birthdayNum = getBirthdayNumber(value);
  const personalYear = getPersonalYear(value, year);
  const personalMonth = getPersonalMonth(personalYear, month);
  const yearInfo = PERSONAL_NUMBERS[personalYear];
  const monthInfo = PERSONAL_NUMBERS[personalMonth];

  document.getElementById("numResult").innerHTML = `
    <h3>ライフパスナンバー：${lifePath}（${life.title}）</h3>
    <p><strong>キーワード：</strong>${life.keywords}</p>
    <p>${life.text}</p>
    <p><strong>強み：</strong>${life.strengths}</p>
    <p><strong>課題：</strong>${life.challenges}</p>
    <p><strong>恋愛：</strong>${life.love}</p>
    <p><strong>仕事：</strong>${life.career}</p>

    <h3>誕生日数：${birthdayNum}</h3>
    <p>${BIRTHDAY_NUMBERS[birthdayNum]}</p>

    <h3>${year}年の個人年数：${personalYear}（${yearInfo.theme}）</h3>
    <p>${yearInfo.advice}</p>

}
function showCouple() {
  const a = document.getElementById("coupleA").value;
  const b = document.getElementById("coupleB").value;
  if (!a || !b) return showError("coupleResult", "2人分の生年月日を入力してください。");
  const signA = getSignByDate(a);
  const signB = getSignByDate(b);
  let rel;
  if (signA.element === signB.element) rel = ELEMENT_COMPAT.same;
  else if (HARMONY_PAIRS.some(([x, y]) =>
    (x === signA.element && y === signB.element) || (x === signB.element && y === signA.element))) rel = ELEMENT_COMPAT.harmony;
  else rel = ELEMENT_COMPAT.challenge;
  const diff = Math.abs(toBase(getLifePath(a)) - toBase(getLifePath(b)));
  const numScore = Math.max(1, 5 - Math.min(diff, 4));
  const overall = Math.round((rel.score + numScore) / 2);
  const overallText = overall >= 4 ? "全体として相性は良好です。"
    : overall === 3 ? "穏やかに支え合える関係です。"
    : "違いを理解し合うことで、関係がさらに深まります。";
  document.getElementById("coupleResult").innerHTML = `
    <p><strong>星座：</strong>${signA.name}（${ELEMENTS[signA.element]}）× ${signB.name}（${ELEMENTS[signB.element]}）</p>
    <div class="score-row"><span class="score-label">星座の相性</span><span class="stars">${stars(rel.score)}</span></div>
    <p>${rel.text}</p>
    <div class="score-row"><span class="score-label">数秘術の相性</span><span class="stars">${stars(numScore)}</span></div>
    <p>${NUM_COMPAT[numScore]}</p>
    <div class="score-row"><span class="score-label">総合評価</span><span class="stars">${stars(overall)}</span></div>
    <p><strong>${overallText}</strong></p>`;
}

// ===== タロット =====
let tarotTimers = [];
function clearTarotTimers() {
  tarotTimers.forEach(clearTimeout);
  tarotTimers = [];
}

function pad2(n) { return String(n).padStart(2, "0"); }

// カードの画像ファイル名（大アルカナ: major-00.png 〜 / 小アルカナ: minor-wands-01.png など）
function cardImagePath(card) {
  if (card.type === "major") {
    const index = MAJOR.findIndex(m => m[0] === card.name);
    return index >= 0 ? `images/cards/major-${pad2(index)}.png` : null;
  }
  return `images/cards/minor-${card.suit}-${pad2(card.rank)}.png`;
}

function cardArtHtml(card) {
  if (USE_CARD_IMAGES) {
    const file = cardImagePath(card);
    if (file) return `<img src="${file}" alt="${escapeHtml(card.name)}">`;
  }
  if (card.type === "major") return `<span class="art-glyph">${MAJOR_GLYPHS[card.name] ?? "✦"}</span>`;
  return SUIT_ICONS[card.suit] ?? "";
}

// ===== 総合解釈の文章パターン =====
const OPENERS = [
  "カードは今の流れをやさしく映し出しています。",
  "3枚のカードが、あなたの今を物語っています。",
  "静かに、カードのメッセージを受け取ってみましょう。"
];
const CLOSERS = [
  "結果を決めつけず、自分の選択を大切にしてください。",
  "カードは道しるべです。最後に決めるのはあなた自身です。",
  "今日できる小さな一歩から始めてみましょう。"
];
const TOPIC_WORDS = {
  仕事: ["仕事", "転職", "会社", "職場", "キャリア"],
  恋愛: ["恋", "恋愛", "彼", "彼女", "パートナー", "結婚"],
  お金: ["お金", "収入", "給料", "貯金", "投資"],
  健康: ["健康", "体", "体調", "睡眠"],
  人間関係: ["人間関係", "友人", "家族", "相手"]
};
const TOPIC_LINES = {
  仕事: ["仕事では、今の役割を見直すと流れが変わりそうです。", "職場での立ち位置を意識すると、評価につながりやすい時期です。"],
  恋愛: ["恋愛では、相手の本音を丁寧に聞くことが鍵になりそうです。", "気持ちを言葉にすると、関係が前に進みやすくなります。"],
  お金: ["お金の面では、無理のない計画を立てることが安心につながります。", "出費と収入のバランスを一度整理してみると良さそうです。"],
  健康: ["体調のサインを大切にして、休息を取り入れましょう。", "生活リズムを整えることが、心と体の安定につながります。"],
  人間関係: ["人間関係では、相手の立場を想像することが和らぎのきっかけになります。", "身近な人との対話を増やすと、安心感が生まれやすいです。"],
  その他: ["今は焦らず、自分のペースで進めることが大切です。"]
};
function detectTopic(question) {
  if (!question) return null;
  for (const [topic, words] of Object.entries(TOPIC_WORDS)) {
    if (words.some(w => question.includes(w))) return topic;
  }
  return "その他";
}

function buildTarotSummary(picks, question) {
  const reversedCount = picks.filter(c => c.reversed).length;
  const majorCount = picks.filter(c => c.type === "major").length;
  const counts = {};
  picks.forEach(c => { if (c.suit) counts[c.suit] = (counts[c.suit] || 0) + 1; });
  const dominant = Object.entries(counts).sort((a, b) => b[1] - a[1])[0];

  const lines = [pickRandom(OPENERS)];

  if (majorCount >= 2) {
    lines.push("大きな人生の転機が近づいているようです。出来事の意味を大切に受け止めましょう。");
  } else if (dominant && dominant[1] >= 2) {
    lines.push(`${SUITS[dominant[0]][0]}のカードが多く出ており、今は${SUITS[dominant[0]][3]}のようです。`);
  } else {
    lines.push("3枚のカードが異なるテーマを示しており、さまざまな要素が絡み合う流れです。");
  }

  const flow = [
    "全体を通して追い風が吹いています。今の流れを信じて進みましょう。",
    "一部に課題はありますが、意識して取り組めば乗り越えられます。",
    "慎重に進めることが大切です。焦らず整えることで流れが変わります。",
    "今は無理をせず、内面を見直すことが最善の選択になりそうです。"
  ];
  lines.push(flow[Math.min(reversedCount, 3)]);

  const topic = detectTopic(question);
  if (topic) lines.push(pickRandom(TOPIC_LINES[topic]));

  const last = picks[2];
  lines.push(`最後に示された「${last.name}」（${last.reversed ? "逆位置" : "正位置"}）は、${last.reversed ? last.rev : last.up}`);

  lines.push(pickRandom(CLOSERS));

  return `<strong>【総合解釈】</strong>` + lines.map(l => `<p>${escapeHtml(l)}</p>`).join("");
}

function drawTarot() {
  clearTarotTimers();
  const question = document.getElementById("question").value.trim();
  const picks = shuffle(DECK).slice(0, 3).map(c => ({ ...c, reversed: Math.random() < 0.5 }));
  const sigils = shuffle(PLANET_SIGILS).slice(0, 3);
  const positions = ["過去・現在", "現在の状況", "これからの流れ"];

  let html = question ? `<p><strong>質問：</strong>${escapeHtml(question)}</p>` : "";
  picks.forEach((c, i) => {
    const upText = c.upright ?? c.up;
    const revText = c.reversed_text ?? c.rev;
    html += `
      <div class="tarot-slot shuffling" id="slot-${i}">
        <div class="position">${positions[i]}</div>
        <div class="tarot-flip">
          <div class="face front">
            <div class="name">${c.name}
              <span class="orientation ${c.reversed ? "reversed-label" : "upright"}">${c.reversed ? "逆位置" : "正位置"}</span>
            </div>
            <div class="card-art ${c.reversed ? "art-rev" : ""}">${cardArtHtml(c)}</div>
            <p>${c.reversed ? revText : upText}</p>
          </div>
          <div class="face back" style="--sigil: '${sigils[i]}'"></div>
        </div>
      </div>`;
  });
  html += `<div class="summary pending" id="tarotSummary">${buildTarotSummary(picks, question)}</div>`;
  document.getElementById("tarotResult").innerHTML = html;

  tarotTimers.push(setTimeout(() => {
    picks.forEach((_, i) => {
      tarotTimers.push(setTimeout(() => {
        const slot = document.getElementById(`slot-${i}`);
        slot.classList.remove("shuffling");
        slot.querySelector(".tarot-flip").classList.add("flipped");
      }, i * 700));
    });
    tarotTimers.push(setTimeout(() => {
      const s = document.getElementById("tarotSummary");
      s.classList.remove("pending");
      s.classList.add("reveal");
    }, picks.length * 700 + 600));
  }, 1000));
}

// ===== 月の満ち欠け =====
function renderMoon() {
  const referenceNewMoon = Date.UTC(2000, 0, 6, 18, 14);
  const days = (Date.now() - referenceNewMoon) / 86400000;
  const phase = ((days / 29.530588853) % 1 + 1) % 1;
  const illuminated = (1 - Math.cos(2 * Math.PI * phase)) / 2;
  const direction = phase < 0.5 ? -1 : 1;
  document.getElementById("moonShadow").style.transform = `translateX(${direction * illuminated * 100}%)`;
  const names = ["新月", "三日月", "上弦の月", "十三夜", "満月", "十六夜", "下弦の月", "有明の月"];
  document.getElementById("moonLabel").textContent = `今日の月：${names[Math.round(phase * 8) % 8]}`;
}
